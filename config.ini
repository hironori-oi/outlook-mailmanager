[general]
; ---------------------------------------------------------------
; メール変換ツールの設定ファイル
; 変更したら start_watcher.cmd をダブルクリックして監視を再起動してください
; %USERPROFILE% は「C:\Users\ユーザー名」に自動で置き換わります
; ---------------------------------------------------------------

; 監視する範囲のルート。この配下なら「どのフォルダーへドロップしても」変換される
; 複数指定するときはセミコロン ; で区切る
watch_roots = %USERPROFILE%\Documents; %USERPROFILE%\Desktop

; 監視の停止中にドロップされた分を、起動時に確実に回収するフォルダー
folders = %USERPROFILE%\Documents\outlook-mail-manager

; 動作モード
;   auto = 下の設定に従って黙って変換する
;   ask  = ドロップのたびに選択画面を出す
;          （フォルダ作成有無・フォルダー名・添付保存有無・本文ファイル名・形式）
mode = ask

; 本文の保存形式（ask モードでは選択画面の初期値になる）
;   html = 見た目そのまま（ブラウザで開ける）
;   txt  = 文字だけ（最小容量・検索や AI 向き）
;   both = 両方保存
format = html

; 保存のスタイル（ask モードでは選択画面の初期値になる）
;   folder = 「YYYYMMDD_件名」フォルダーを作ってその中に保存
;   flat   = フォルダーを作らず、ドロップした場所に直接保存
layout = folder

; 特定のフォルダーだけ保存スタイルを変えたいとき（セミコロン区切りで指定）
; 例: flat_folders = %USERPROFILE%\Documents\案件A
flat_folders =
folder_folders =

; 変換に成功した後の元ファイル (.eml / .msg) の扱い
;   keep    = そのまま残す
;   recycle = ごみ箱へ移動（復元可能）
;   delete  = 完全に削除
original = recycle

; メール本文内のインターネット上の画像を表示するか
;   true  = 表示する（見た目は元のまま。開くと画像取得が送信者に伝わる場合あり）
;   false = ブロックする（安全寄り。画像が表示されなくなる）
remote_images = true

; 巡回チェックの間隔（秒）
poll_seconds = 4
